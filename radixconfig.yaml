apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
    name: acidwatch
spec:
    environments:
        - name: dev
          build:
              from: main
        - name: prod
    dnsAlias:
        - alias: acidwatch
          component: frontend
          environment: prod
    components:
        - name: frontend
          variables:
              TENANT_ID: 3aa4a235-b6e2-48d5-9195-7fcf05b459b0
          environmentConfig:
              - environment: dev
                variables:
                    CLIENT_ID: 49385006-e775-4109-9635-2f1a2bdc8ea8
                    API_URL: https://backend-acidwatch-dev.radix.equinor.com
                    API_SCOPE: api://456cc109-08d7-4c11-bf2e-a7b26660f99e/AcidWatch.User
                    APPINSIGHTS_CONNECTIONSTRING:

              - environment: prod
                variables:
                    CLIENT_ID: bb73aaf4-9ddb-4229-a3a1-008faebe30b7
                    API_URL: https://backend-acidwatch-prod.radix.equinor.com
                    API_SCOPE:
                    APPINSIGHTS_CONNECTIONSTRING:

          ports:
              - name: http
                port: 5200
          publicPort: http
          src: frontend
        - name: backend
          network:
              ingress:
                  public:
                      proxyReadTimeout: 300
                      proxySendTimeout: 300
          secrets:
              - BACKEND_CLIENT_SECRET
              - CONNECTION_STRING
              - ACIDWATCH_DATABASE
              - BROKER_URL
          environmentConfig:
              - environment: dev
                variables:
                    ACIDWATCH_ENV: production
                    FRONTEND_URI: https://frontend-acidwatch-dev.radix.equinor.com
                    FRONTEND_CLIENT_ID: 49385006-e775-4109-9635-2f1a2bdc8ea8
                    BACKEND_CLIENT_ID: 456cc109-08d7-4c11-bf2e-a7b26660f99e
                    BACKEND_API_SCOPE: api://456cc109-08d7-4c11-bf2e-a7b26660f99e/AcidWatch.User
                    TOCOMO_API_BASE_URI: https://backend-tocomo-dev.radix.equinor.com
                    ARCS_API_BASE_URI: https://api-arcs-eq-fork.radix.equinor.com
                    ARCS_EXP_API_BASE_URI: https://api-arcs-dev.radix.equinor.com
                    PHPITZ_API_BASE_URI: https://backend-phpitz-dev.radix.equinor.com
                    APPLICATIONINSIGHTS_CONNECTION_STRING:
                    OASIS_URI: https://api-oasis-test.radix.equinor.com
              - environment: prod
                variables:
                    ACIDWATCH_ENV: production
                    FRONTEND_URI: https://frontend-acidwatch-prod.radix.equinor.com
                    FRONTEND_CLIENT_ID: bb73aaf4-9ddb-4229-a3a1-008faebe30b7
                    BACKEND_CLIENT_ID: 873cbfab-30ca-4323-b5d5-e7955cc89ad9
                    BACKEND_API_SCOPE: api://873cbfab-30ca-4323-b5d5-e7955cc89ad9/AcidWatch.User
                    TOCOMO_API_BASE_URI: https://backend-tocomo-prod.radix.equinor.com
                    ARCS_API_BASE_URI: https://api-arcs-eq-fork.radix.equinor.com
                    ARCS_EXP_API_BASE_URI: https://api-arcs-prod.radix.equinor.com
                    PHPITZ_API_BASE_URI: https://backend-phpitz-prod.radix.equinor.com
                    APPLICATIONINSIGHTS_CONNECTION_STRING:
                    OASIS_URI: https://api-oasis-prod.radix.equinor.com
          publicPort: http
          ports:
              - name: http
                port: 8000
          dockerfileName: backend/Dockerfile
          resources:
              requests:
                  memory: "800M"
                  cpu: "4000m"
              limits:
                  memory: "800M"
                  cpu: "4000m"
        - name: worker-tocomo
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: tocomo
          secrets:
              - BROKER_URL
          environmentConfig:
              - environment: dev
                variables:
                    TOCOMO_API_BASE_URI: https://backend-tocomo-dev.radix.equinor.com
              - environment: prod
                variables:
                    TOCOMO_API_BASE_URI: https://backend-tocomo-prod.radix.equinor.com
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.tocomo
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL
        - name: worker-arcs
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: arcs
          secrets:
              - BROKER_URL
          environmentConfig:
              - environment: dev
                variables:
                    ARCS_API_BASE_URI: https://api-arcs-eq-fork.radix.equinor.com
              - environment: prod
                variables:
                    ARCS_API_BASE_URI: https://api-arcs-eq-fork.radix.equinor.com
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.arcs
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL
        - name: worker-arcs-exp
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: arcs_exp
          secrets:
              - BROKER_URL
          environmentConfig:
              - environment: dev
                variables:
                    ARCS_EXP_API_BASE_URI: https://api-arcs-dev.radix.equinor.com
              - environment: prod
                variables:
                    ARCS_EXP_API_BASE_URI: https://api-arcs-prod.radix.equinor.com
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.arcs_exp
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL
        - name: worker-solubilityccs
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: solubilityccs
          secrets:
              - BROKER_URL
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.solubilityccs
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL
        - name: worker-gibbs
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: gibbs_minimization
          secrets:
              - BROKER_URL
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.gibbs_minimization
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL
        - name: worker-phpitz-reactive
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: phpitz_reactive
          secrets:
              - BROKER_URL
          environmentConfig:
              - environment: dev
                variables:
                    PHPITZ_API_BASE_URI: https://backend-phpitz-dev.radix.equinor.com
              - environment: prod
                variables:
                    PHPITZ_API_BASE_URI: https://backend-phpitz-prod.radix.equinor.com
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.phpitz_reactive
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL
        - name: worker-phpitz-solubility
          dockerfileName: backend/Dockerfile
          variables:
              MODEL_IDS: phpitz_solubility
          secrets:
              - BROKER_URL
          environmentConfig:
              - environment: dev
                variables:
                    PHPITZ_API_BASE_URI: https://backend-phpitz-dev.radix.equinor.com
              - environment: prod
                variables:
                    PHPITZ_API_BASE_URI: https://backend-phpitz-prod.radix.equinor.com
          horizontalScaling:
              minReplicas: 0
              maxReplicas: 5
              triggers:
                  - name: jobs
                    azureServiceBus:
                        queueName: acidwatch.phpitz_solubility
                        messageCount: 1
                        activationMessageCount: 1
                        connectionFromEnv: BROKER_URL

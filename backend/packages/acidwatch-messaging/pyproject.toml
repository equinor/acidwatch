[project]
name = "acidwatch-messaging"
version = "0.1.0"
description = "Broker transports and worker runtime for AcidWatch models"
requires-python = ">=3.12, <3.14"
dependencies = [
  "acidwatch-models",
  "aio-pika>=10.0.1",
  "azure-servicebus>=7.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acidwatch-worker-runtime"
version = "0.1.0"
description = "Worker execution runtime for AcidWatch models"
requires-python = ">=3.12, <3.14"
dependencies = [
  "acidwatch-messaging",
  "httpx",
  "pydantic",
  "typing-extensions",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

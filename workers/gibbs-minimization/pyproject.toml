[project]
name = "acidwatch-worker-gibbs-minimization"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
  "acidwatch-models",
  "acidwatch-worker-runtime",
  "neqsim==3.1.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acidwatch-worker-tocomo"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
  "acidwatch-messaging",
  "acidwatch-models",
  "acidwatch-worker-runtime",
  "tocomo",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
acidwatch-messaging = { path = "../../backend/packages/acidwatch-messaging", editable = true }
acidwatch-models = { path = "../../backend/packages/acidwatch-models", editable = true }
acidwatch-worker-runtime = { path = "../../backend/packages/acidwatch-worker-runtime", editable = true }
tocomo = { git = "https://github.com/equinor/tocomo", rev = "74e23131bd27d63dcf71b4a62eb81cdb76d981c9", subdirectory = "backend" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

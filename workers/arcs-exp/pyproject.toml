[project]
name = "acidwatch-worker-arcs-exp"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = ["acidwatch-models", "acidwatch-messaging", "arcs", "pandas"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.sources]
arcs = { git = "https://github.com/badw/arcs.git", rev = "13d4d589e2e86fbf79da7c333cd685761c9ba665" }

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

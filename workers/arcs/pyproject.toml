[project]
name = "acidwatch-worker-arcs"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = ["acidwatch-messaging", "acidwatch-models", "acidwatch-worker-runtime", "arcs"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
 
[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
acidwatch-messaging = { path = "../../backend/packages/acidwatch-messaging", editable = true }
acidwatch-models = { path = "../../backend/packages/acidwatch-models", editable = true }
acidwatch-worker-runtime = { path = "../../backend/packages/acidwatch-worker-runtime", editable = true }
arcs = { git = "https://github.com/equinor/arcs.git", rev = "21ded96960d28d549c0950fbc1aa09c94159f652" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acidwatch-worker-srk-vanlaar"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
  "acidwatch-messaging",
  "acidwatch-worker-runtime",
  "neqsim",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
acidwatch-messaging = { path = "../../backend/packages/acidwatch-messaging", editable = true }
acidwatch-worker-runtime = { path = "../../backend/packages/acidwatch-worker-runtime", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

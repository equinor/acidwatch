name: FastAPI backend with SQLite

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: astral-sh/setup-uv@v5

    - name: Install backend
      run: uv sync --package acidwatch-api

    - name: Run ruff
      run: |
        uv run --package acidwatch-api ruff format --check src tests packages ../workers
        uv run --package acidwatch-api ruff check src tests packages ../workers

    - name: Run mypy
      run: uv run --package acidwatch-api mypy --strict src packages/acidwatch-models/src packages/acidwatch-messaging/src

    - name: Run pytest
      run: |
        cp .env.example .env
        uv run --package acidwatch-api pytest tests

  worker-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - acidwatch-worker-tocomo
          - acidwatch-worker-arcs
          - acidwatch-worker-arcs-exp
          - acidwatch-worker-solubilityccs
          - acidwatch-worker-gibbs-minimization
          - acidwatch-worker-phpitz-reactive
          - acidwatch-worker-phpitz-solubility

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: astral-sh/setup-uv@v5

    - name: Install worker
      run: uv sync --package ${{ matrix.package }}

    - name: Build worker package
      run: uv build --package ${{ matrix.package }}

    - name: Test Gibbs worker
      if: matrix.package == 'acidwatch-worker-gibbs-minimization'
      run: uv run --package ${{ matrix.package }} pytest workers/gibbs-minimization/tests

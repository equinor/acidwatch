services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    ports:
      - "8001:8001"
    env_file:
      - path: backend/.env
        required: false
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
  worker-tocomo:
